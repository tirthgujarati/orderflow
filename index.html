<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Order Flow</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="modulepreload" href="app.js"><link rel="modulepreload" href="core.js">
<style>
/* TradingView dark-theme colours (docs + live chart, 21 Nov 2026) */
:root{--bg:#000000;--gap:#222222;--line:#303030;--text:#dbdbdb;--sub:#b8b8b8;--mut:#8c8c8c;--hover:#2e2e2e;--green:#089981;--red:#f23645;--orange:#ff9800;--blue:#2962ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--gap);color:var(--text);font:12px/1.3 -apple-system,"Segoe UI",Inter,system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column}
header,footer,nav{flex:none}
.mono{font-family:Consolas,"JetBrains Mono",ui-monospace,Menlo,monospace}
button,select{font:inherit;color:inherit}
header{height:46px;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--bg);overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.logo{font-weight:800;letter-spacing:1.5px;color:var(--orange);font-size:13px;white-space:nowrap}
select{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:#fff;outline:none;max-width:210px}
.grp{display:flex;gap:4px;flex:none}
.chip{padding:4px 9px;border:1px solid var(--line);border-radius:6px;color:var(--sub);background:var(--bg);white-space:nowrap;cursor:pointer;user-select:none}
.chip:hover{background:var(--hover)}
.chip.on{color:#fff;border-color:#464646;background:var(--hover)}
.px{font-size:19px;font-weight:700;white-space:nowrap}
.sm{color:var(--sub);font-size:11px;white-space:nowrap}
.sp{flex:1}
.live{display:flex;align-items:center;gap:6px;color:var(--sub);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}.dot.warn{background:var(--orange)}.dot.bad{background:var(--red)}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(420px,38%) 1fr 300px;gap:4px;padding:4px 0}
section{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);border-radius:4px;overflow:hidden;position:relative}
.ttl{height:24px;flex:none;display:flex;align-items:center;gap:8px;padding:0 9px;color:var(--sub);font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden}
.ttl b{color:var(--text);font-weight:600}
.ttl .r{margin-left:auto;text-transform:none;letter-spacing:0}
.cv{position:relative;min-height:0}
.cv canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.grow{flex:1}
.zb{position:absolute;right:70px;top:6px;display:flex;gap:4px;z-index:2}
.zb button{width:28px;height:26px;border-radius:6px;border:1px solid var(--line);background:rgba(0,0,0,.75);cursor:pointer}
.zb button:hover{background:var(--hover)}
footer{height:26px;display:flex;align-items:center;gap:16px;padding:0 10px;background:var(--bg);color:var(--sub);font-size:11px;white-space:nowrap;overflow:hidden}
footer b{color:var(--text);font-weight:600}
.g{color:var(--green)}.rd{color:var(--red)}.o{color:var(--orange)}
nav{display:none}
/* phone / narrow: one panel at a time, switched from the bottom bar */
@media (max-width: 860px){
  header{height:auto;flex-wrap:wrap;gap:6px 8px;padding:7px 10px;overflow:visible}
  header .sp{display:none}
  .logo{font-size:0}.logo::first-letter{font-size:15px}
  select{max-width:150px}
  .live{margin-left:auto}
  .grp .chip{padding:4px 8px}
  .wide{display:none!important}
  main{display:block;padding:4px 0 0;position:relative}
  main>section{height:100%;display:none}
  body[data-tab=heat] #sec-heat, body[data-tab=fp] #sec-fp, body[data-tab=dom] #sec-side, body[data-tab=tape] #sec-side{display:flex}
  body[data-tab=dom] .tape-part{display:none!important} body[data-tab=tape] .dom-part{display:none!important}
  body[data-tab=tape] #tapebox{flex:1}
  body[data-tab=dom] #dombox{flex:1}
  footer{display:none}
  nav{display:flex;height:calc(58px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--bg);border-top:1px solid var(--line);justify-content:space-around;align-items:center}
  nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mut);font-size:10.5px;padding:6px 10px;cursor:pointer}
  nav button.on{color:var(--orange)}
  nav i{font-style:normal;font-size:17px}
  .zb{right:66px}
}
</style>
</head>
<body data-tab="heat">
<header>
  <div class="logo">◆ ORDERFLOW</div>
  <select id="mkt" aria-label="Market"></select>
  <div><span class="px mono" id="hp">-</span></div>
  <div class="sm mono wide" id="hs"></div>
  <div class="grp" id="tfs"></div>
  <div class="grp" id="bks"></div>
  <div class="sp"></div>
  <div class="live mono"><div class="dot" id="dot"></div><span id="lv">connecting</span></div>
</header>
<main>
  <section id="sec-heat">
    <div class="ttl"><b>Liquidity heatmap</b><span id="heatInfo"></span><span class="r mono" id="heatR"></span></div>
    <div class="cv grow"><canvas id="heat"></canvas>
      <div class="zb"><button data-z="heat-">−</button><button data-z="heat+">+</button><button data-z="heatC" title="contrast">◐</button><button data-z="heat0" title="follow live">⟲</button></div></div>
    <div class="ttl"><b>Delta</b><span id="deltaInfo"></span><span class="r mono" id="deltaR"></span></div>
    <div class="cv" style="height:16%;min-height:64px"><canvas id="delta"></canvas></div>
    <div class="ttl"><b>CVD</b><span id="cvdInfo"></span><span class="r mono" id="cvdR"></span></div>
    <div class="cv" style="height:18%;min-height:74px"><canvas id="cvd"></canvas></div>
  </section>
  <section id="sec-fp">
    <div class="ttl"><b>Footprint</b><span id="fpInfo"></span><span class="r">POC <span class="o">▭</span> · imbalance ≥ 300%</span></div>
    <div class="cv grow"><canvas id="fp"></canvas>
      <div class="zb"><button data-z="fp-">−</button><button data-z="fp+">+</button><button data-z="fp0" title="latest candles">⟲</button></div></div>
  </section>
  <section id="sec-side">
    <div class="ttl dom-part"><b>DOM</b><span id="domInfo"></span><span class="r mono" id="domR"></span></div>
    <div class="cv dom-part" id="dombox" style="height:56%"><canvas id="dom"></canvas></div>
    <div class="ttl tape-part"><b>Time &amp; sales</b><span id="tapeInfo"></span><span class="r mono" id="tapeR"></span></div>
    <div class="cv grow tape-part" id="tapebox"><canvas id="tape"></canvas></div>
  </section>
</main>
<footer id="foot"></footer>
<nav id="nav">
  <button data-tab="heat" class="on"><i>▦</i>Heatmap</button><button data-tab="fp"><i>▤</i>Footprint</button>
  <button data-tab="dom"><i>☰</i>DOM</button><button data-tab="tape"><i>⇅</i>Tape</button>
</nav>
<script type="module" src="app.js"></script>
</body></html>
