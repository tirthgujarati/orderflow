name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Put the web app inside the Android app
        run: |
          mkdir -p android/app/src/main/assets/web
          cp index.html app.js engine.js core.js feeds.js lzma.js sw.js manifest.json icon.svg android/app/src/main/assets/web/

      - name: Signing key (from repository secrets)
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: echo "$KS_B64" | base64 -d > android/app/release.p12

      - name: Build the APK
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Publish it as the "app" release (download link stays the same)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk OrderFlow.apk
          gh release delete app --yes --cleanup-tag || true
          gh release create app OrderFlow.apk --title "Order Flow for Android" --notes "Built from ${GITHUB_SHA::7}. Install OrderFlow.apk on your Android phone."
